name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Unit & Foundry EVM Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pinned Foundry (v1.8.7)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v1.8.7'

      - name: Pre-bake cached libraries (/opt/foundry_base/lib)
        run: |
          sudo mkdir -p /opt/foundry_base/lib
          sudo git clone --depth 1 -b v1.9.5 https://github.com/foundry-rs/forge-std.git /opt/foundry_base/lib/forge-std
          sudo git clone --depth 1 -b v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts.git /opt/foundry_base/lib/openzeppelin-contracts
          sudo chmod -R 777 /opt/foundry_base

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest Test Suite (Unit & Real EVM Integration)
        run: |
          pytest tests/ -v
