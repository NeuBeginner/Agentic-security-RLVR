name: Aegis-RLVR CI

on:
  push:
    branches:
      - 'audit/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'audit/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Reward v2 and trusted harness regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5"

      - name: Run trusted evidence and reward contract tests
        env:
          PYTHONPATH: .
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m pytest -q tests/test_harness_contract.py
          python -m pytest -q tests/test_reward_shaping_hardening.py
          python -m pytest -q tests/test_contract_normalization_v2.py

      - name: Run GRPO and trajectory integrity tests
        env:
          PYTHONPATH: .
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m pytest -q tests/test_grpo.py
          python -m pytest -q tests/test_grpo_integrity.py
          python -m pytest -q tests/test_trajectory_integrity.py
          python -m pytest -q tests/test_round5_regression.py

      - name: Run complete test suite
        env:
          PYTHONPATH: .
          TOKENIZERS_PARALLELISM: "false"
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-reconciled-ci-report
          path: test-results.xml
          if-no-files-found: warn
