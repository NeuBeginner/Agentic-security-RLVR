name: Aegis-RLVR CI

on:
  push:
    branches:
      - 'audit/**'
      - 'feature/**'
      - 'integration/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'audit/**'
      - 'integration/**'
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Reward v2 and trusted harness regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5"

      - name: Run trusted evidence and reward contract tests
        env:
          PYTHONPATH: .
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m pytest -q tests/test_harness_contract.py
          python -m pytest -q tests/test_reward_shaping_hardening.py
          python -m pytest -q tests/test_contract_normalization_v2.py

      - name: Run GRPO and trajectory integrity tests
        env:
          PYTHONPATH: .
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m pytest -q tests/test_grpo.py
          python -m pytest -q tests/test_grpo_integrity.py
          python -m pytest -q tests/test_trajectory_integrity.py
          python -m pytest -q tests/test_round5_regression.py

      - name: Run complete test suite
        env:
          PYTHONPATH: .
          TOKENIZERS_PARALLELISM: "false"
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-reconciled-ci-report
          path: test-results.xml
          if-no-files-found: warn

  foundry-integration:
    name: Real Foundry EVM integration probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov numpy

      - name: Install Foundry (bounded retries)
        id: install-foundry
        run: |
          set -e
          FOUNDRY_OK=false
          for attempt in 1 2 3; do
            echo "Attempt $attempt: installing Foundry toolchain..."
            if curl -sSL https://raw.githubusercontent.com/foundry-rs/foundry/master/foundryup/install | bash; then
              export PATH="$HOME/.foundry/bin:$PATH"
              echo "$HOME/.foundry/bin" >> $GITHUB_PATH
              if foundryup; then
                echo "Foundry toolchain installed successfully on attempt $attempt"
                FOUNDRY_OK=true
                break
              fi
            fi
            echo "Attempt $attempt failed. Backing off before retry..."
            sleep 15
          done
          if [ "$FOUNDRY_OK" = "false" ]; then
            echo "::error title=Foundry Toolchain Unavailable::GitHub Releases CDN download failed after 3 attempts with HTTP timeout. Live Foundry EVM integration is NOT_RUN / UNAVAILABLE."
            echo "## Live Foundry EVM Integration Probe: NOT_RUN / UNAVAILABLE" >> $GITHUB_STEP_SUMMARY
            echo "**Status**: NOT_RUN / UNAVAILABLE" >> $GITHUB_STEP_SUMMARY
            echo "**Root Cause**: Upstream GitHub Releases asset proxy timed out (HTTP 503/504) downloading foundryup/foundry binaries." >> $GITHUB_STEP_SUMMARY
            echo "**Scope**: Infrastructure failure. Deterministic Python and contract tests executed independently in 'tests' job." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run Live Foundry Integration Tests
        env:
          PYTHONPATH: .
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          forge --version
          python -m pytest -v tests/test_real_benchmark_execution.py -k "test_real_foundry_integration" --junitxml=test-results-foundry.xml

      - name: Upload Foundry test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-foundry-integration-report
          path: test-results-foundry.xml
          if-no-files-found: warn
