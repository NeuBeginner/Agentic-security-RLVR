name: Deploy Aegis CPU audit to Modal

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_CPU_AUDIT to deploy the CPU-only audit app"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aegis-cpu-audit-modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feat/modal-cpu-audit' && inputs.confirm == 'DEPLOY_CPU_AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: modal-cpu-audit
    env:
      MODAL_PROFILE: neubeginner
      AEGIS_SOURCE_COMMIT: ${{ github.sha }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deployment dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install modal

      - name: Validate deployment credentials and source
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || { echo "Missing MODAL_TOKEN_ID repository secret" >&2; exit 1; }
          test -n "${MODAL_TOKEN_SECRET:-}" || { echo "Missing MODAL_TOKEN_SECRET repository secret" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$AEGIS_SOURCE_COMMIT"
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("modal_cpu_audit_app.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          assert any(
              isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "SOURCE_COMMIT" for t in node.targets)
              for node in tree.body
          ), "CPU audit app does not expose SOURCE_COMMIT"
          assert any(
              isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "probe_deployment_provenance"
              for node in ast.walk(tree)
          ), "CPU audit app does not expose the Modal-authenticated provenance probe"
          print("deployment source and provenance entry point validated")
          PY

      - name: Confirm Modal workspace
        run: |
          set -euo pipefail
          modal token info

      - name: Deploy CPU-only audit application
        run: |
          set -euo pipefail
          modal deploy --env main modal_cpu_audit_app.py

      - name: Verify deployed commit and CPU-only resource declaration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import modal

          expected = os.environ["AEGIS_SOURCE_COMMIT"]
          probe = modal.Function.from_name(
              "aegis-rlvr-cpu-audit", "probe_deployment_provenance",
              environment_name="main"
          ).remote()
          assert probe.get("status") == "COMPLETED", json.dumps(probe, sort_keys=True)
          actual = probe.get("source_commit")
          assert actual == expected, f"deployed source mismatch: expected {expected}, got {actual!r}"
          resources = probe.get("declared_resources") or {}
          assert resources.get("gpu") is None, f"GPU must remain disabled: {resources!r}"
          assert resources.get("cpu") == 2.0, f"unexpected CPU declaration: {resources!r}"
          assert resources.get("memory") == 2048, f"unexpected memory declaration: {resources!r}"
          print(json.dumps({
              "status": "DEPLOYED_AND_VERIFIED",
              "source_commit": actual,
              "declared_resources": resources,
          }, sort_keys=True))
          PY
