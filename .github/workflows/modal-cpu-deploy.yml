name: Deploy Aegis CPU audit to Modal

# The CPU-only deployment of the audit service, bound to an exact Git commit.
#
# Why the deployment is triggered by a push and not only by a manual dispatch
# ---------------------------------------------------------------------------
# GitHub resolves ``workflow_dispatch`` against the **default branch**: a
# workflow that exists only on a feature branch cannot be dispatched at all
# (``HTTP 404: workflow modal-cpu-deploy.yml not found on the default
# branch``). A push event, in contrast, runs the workflow from the pushed
# commit, so the branch-local workflow file is the one that executes. The push
# trigger is therefore the path that actually deploys, and the manual dispatch
# remains available for the day the file is merged into the default branch.
#
# The deployment is SHA-attested: the job checks out ``github.sha``, the image
# of the application bakes that commit into itself, and the verification step
# calls the deployed service and compares the commit the running container
# reports with the commit of GitHub. A deployment that cannot prove its own
# commit fails the job instead of being reported as successful.

on:
  push:
    branches:
      - 'feat/modal-cpu-audit'
    paths:
      - 'modal_cpu_audit_app.py'
      - 'sandbox/**'
      - 'benchmarks/**'
      - 'requirements.txt'
      - 'requirements-test.txt'
      - '.github/workflows/modal-cpu-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_CPU_AUDIT to deploy the CPU-only audit app"
        required: true
        type: string

permissions:
  contents: read

# Two deployments of the same application must never overlap: the second one
# would replace the deployment of the first one while it is still verifying it.
concurrency:
  group: aegis-cpu-audit-modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/feat/modal-cpu-audit'
      && (github.event_name == 'push' || inputs.confirm == 'DEPLOY_CPU_AUDIT')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: modal-cpu-audit
    env:
      MODAL_PROFILE: neubeginner
      # The workspace the credentials have to belong to. The check is fail
      # closed: credentials of another workspace stop the run instead of
      # silently addressing a different account.
      MODAL_EXPECTED_WORKSPACE: 'neubeginner'
      AEGIS_SOURCE_COMMIT: ${{ github.sha }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deployment dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install modal

      - name: Validate deployment credentials and source
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || { echo "Missing MODAL_TOKEN_ID repository secret" >&2; exit 1; }
          test -n "${MODAL_TOKEN_SECRET:-}" || { echo "Missing MODAL_TOKEN_SECRET repository secret" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$AEGIS_SOURCE_COMMIT"
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("modal_cpu_audit_app.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          assert any(
              isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "SOURCE_COMMIT" for t in node.targets)
              for node in tree.body
          ), "CPU audit app does not expose SOURCE_COMMIT"

          assert any(
              isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "probe_deployment_provenance"
              for node in ast.walk(tree)
          ), "CPU audit app does not expose the Modal-authenticated provenance probe"

          # The commit has to travel into the container: the provider forwards
          # neither the environment of the client nor an arbitrary environment
          # variable into the container, so the image itself has to carry it.
          baked = [
              node
              for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and node.func.attr == "env"
              and any(
                  isinstance(arg, ast.Dict)
                  and any(
                      isinstance(key, ast.Name) and key.id == "SOURCE_COMMIT_ENV_VAR"
                      for key in arg.keys
                  )
                  for arg in node.args
              )
          ]
          assert baked, "the CPU audit image does not bake the source commit"

          print("deployment source and provenance entry point validated")
          PY

      - name: Confirm Modal workspace
        run: |
          set -euo pipefail
          info="$(modal token info 2>&1)" || { printf '%s\n' "${info}" >&2; exit 1; }
          printf '%s\n' "${info}" | sed -E 's/^(Token: ).*/\1[redacted]/'
          workspace="$(printf '%s\n' "${info}" | sed -nE 's/^Workspace: ([^ ]+).*/\1/p')"
          if [ -z "${workspace}" ]; then
            echo "the provider reported no workspace for these credentials" >&2
            exit 1
          fi
          if [ -n "${MODAL_EXPECTED_WORKSPACE:-}" ] && [ "${workspace}" != "${MODAL_EXPECTED_WORKSPACE}" ]; then
            echo "these credentials belong to the workspace '${workspace}'," >&2
            echo "not to the expected workspace '${MODAL_EXPECTED_WORKSPACE}'" >&2
            exit 1
          fi
          echo "authenticated against the workspace '${workspace}'"

      - name: Deploy CPU-only audit application
        run: |
          set -euo pipefail
          modal deploy --env main modal_cpu_audit_app.py

      - name: Verify deployed commit and CPU-only resource declaration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import modal

          expected = os.environ["AEGIS_SOURCE_COMMIT"]
          probe = modal.Function.from_name(
              "aegis-rlvr-cpu-audit", "probe_deployment_provenance",
              environment_name="main"
          ).remote()
          assert probe.get("status") == "COMPLETED", json.dumps(probe, sort_keys=True)
          state = probe.get("source_commit_state")
          assert state == "known", f"the deployed image carries no commit: {probe!r}"
          actual = probe.get("source_commit")
          assert actual == expected, f"deployed source mismatch: expected {expected}, got {actual!r}"
          resources = probe.get("declared_resources") or {}
          assert resources.get("gpu") is None, f"GPU must remain disabled: {resources!r}"
          assert resources.get("cpu") == 2.0, f"unexpected CPU declaration: {resources!r}"
          assert resources.get("memory") == 2048, f"unexpected memory declaration: {resources!r}"
          print(json.dumps({
              "status": "DEPLOYED_AND_VERIFIED",
              "source_commit": actual,
              "source_commit_state": state,
              "declared_resources": resources,
          }, sort_keys=True))
          PY
