name: Aegis-RLVR Modal CPU Audit

# The CPU-only verification of this repository on the Modal provider.
#
# What this workflow does
# -----------------------
# 1. runs the offline CPU contract suite - the tests that prove, without any
#    provider call, that the CPU audit service declares no GPU, mounts the
#    model cache read-only and refuses an unauthorised call;
# 2. runs the live CPU-only Modal smoke test - one ephemeral worker with
#    ``gpu=None``, ``cpu=0.5``, ``memory=256`` and a 60 s timeout - and
#    validates the evidence it produced.
#
# What this workflow deliberately never does
# ------------------------------------------
# * it never allocates a GPU (no H100, no T4, no GPU class at all);
# * it never deploys: the smoke test runs an **ephemeral** app, so no
#   deployment is created, replaced or stopped, and no production worker of
#   this repository (``modal_app.py``) is ever touched;
# * it never writes into a volume: the smoke app declares no volume at all,
#   and the read-only model cache of the CPU audit service is never mounted
#   by this workflow;
# * it never mutates the GPU production application, the CPU audit deployment
#   or any volume of the workspace.
#
# The only provider-side effect of a run is one ephemeral, CPU-only container
# that is destroyed when the run ends, and the read-only calls the provider
# exposes for the evidence (app list, container list, billing report).
#
# Authorisation
# -------------
# The provider is authenticated with the repository secrets ``MODAL_TOKEN_ID``
# and ``MODAL_TOKEN_SECRET``. They are passed to the process as environment
# variables, which is the Modal SDK's documented way of authenticating a CI
# job; no ``.modal.toml`` is written to the runner and no token is ever
# printed. The secrets are masked in the logs by GitHub, the token id is
# additionally redacted by the workflow itself, and the workspace is pinned
# explicitly so the job can never address another workspace than the one the
# secrets belong to.

on:
  push:
    branches:
      - 'feat/modal-cpu-audit'
      - 'feat/modal-cpu-audit/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'The Modal profile whose token the secrets belong to.'
        required: false
        default: 'neubeginner'
      seed:
        description: 'The seed of the CPU-only smoke test.'
        required: false
        default: 'ci'

# A new push cancels the run that is still in flight: two concurrent CPU
# smoke tests of the same branch would only bill twice for the same proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow reads the repository and writes back nothing but the
# artifacts of the run.
permissions:
  contents: read

env:
  PYTHONPATH: '.'
  TOKENIZERS_PARALLELISM: 'false'
  # The workspace of this project. It is pinned here so the SDK and the CLI
  # always address the same workspace - a mismatch would send the SDK to a
  # different one that happens to own a volume of the same name.
  MODAL_PROFILE: ${{ inputs.profile || 'neubeginner' }}
  # The workspace the credentials have to belong to. The check is fail
  # closed: a credential of another workspace stops the run instead of
  # silently addressing the wrong account.
  MODAL_EXPECTED_WORKSPACE: 'neubeginner'
  # The evidence of a CI run is written into its own directory: the published
  # evidence of the repository is never overwritten by a CI run.
  MODAL_EVIDENCE_DIR: 'benchmarks/evidence/ci_modal_smoke'
  MODAL_SEED: ${{ inputs.seed || 'ci' }}

jobs:
  cpu-contract:
    name: CPU audit contract (offline, no provider call)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the evidence of this repository is bound to the
          # commit it was produced from, and the binding check compares the
          # commits of the branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run the CPU audit contract suite
        env:
          PYTHONPATH: '.'
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_cpu_audit_contract.py \
            tests/test_cpu_audit_evidence_consistency.py \
            tests/test_iteration19_evidence_integrity.py \
            --junitxml=test-results-cpu-contract.xml

      - name: Upload the CPU contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-cpu-contract-report
          path: test-results-cpu-contract.xml
          if-no-files-found: warn

  modal-cpu-smoke:
    name: Live CPU-only Modal smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: cpu-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Authorise the Modal provider
        env:
          # The two secrets of the repository. They are passed as environment
          # variables - the Modal SDK reads them from there - and they are
          # masked in the log by GitHub. Neither of them is ever printed.
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MODAL_TOKEN_ID:-}" ] || [ -z "${MODAL_TOKEN_SECRET:-}" ]; then
            echo "the repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are not set;" >&2
            echo "the provider cannot be authenticated without them." >&2
            exit 1
          fi
          # The check is a read-only provider call. It states the workspace
          # the credentials belong to; the token id itself is redacted here
          # and masked by GitHub on top of that.
          info="$(modal token info 2>&1)" || { printf '%s\n' "${info}" >&2; exit 1; }
          printf '%s\n' "${info}" | sed -E 's/^(Token: ).*/\1[redacted]/'
          workspace="$(printf '%s\n' "${info}" | sed -nE 's/^Workspace: ([^ ]+).*/\1/p')"
          if [ -z "${workspace}" ]; then
            echo "the provider reported no workspace for these credentials" >&2
            exit 1
          fi
          if [ -n "${MODAL_EXPECTED_WORKSPACE:-}" ] && [ "${workspace}" != "${MODAL_EXPECTED_WORKSPACE}" ]; then
            echo "these credentials belong to the workspace '${workspace}'," >&2
            echo "not to the expected workspace '${MODAL_EXPECTED_WORKSPACE}'" >&2
            exit 1
          fi
          echo "authenticated against the workspace '${workspace}'"

      - name: Run the live CPU-only smoke test
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # The explicit approval of the live invocation. The smoke driver
          # refuses to run without it: this workflow is the approved way to
          # invoke the CPU-only smoke test from CI.
          R1_APPROVE_ITERATION19_CPU_SMOKE: '1'
        run: |
          set -euo pipefail
          python -m benchmarks.run_iteration19_cpu_smoke \
            --profile "${MODAL_PROFILE}" \
            --seed "${MODAL_SEED}" \
            --evidence-dir "${MODAL_EVIDENCE_DIR}" 2>&1 | tee modal-smoke.log

      - name: Validate the evidence of the run
        env:
          PYTHONPATH: '.'
        run: |
          set -euo pipefail
          python -m benchmarks.validate_iteration19_evidence \
            --evidence-dir "${MODAL_EVIDENCE_DIR}" \
            --report "${MODAL_EVIDENCE_DIR}/validation_evidence.json" \
            --code-sha "$(git rev-parse HEAD)" 2>&1 | tee modal-validation.log

      - name: Prove the run stayed inside its bounds
        env:
          PYTHONPATH: '.'
        run: |
          set -euo pipefail
          python - <<'PY'
          """
          The bounds of the run, checked against the evidence it produced.

          The evidence is the source of the statement: the workflow does not
          assert that no GPU was used, it reads the recorded facts and fails
          when one of them contradicts the bounds.
          """
          import json
          import os
          import re
          from pathlib import Path

          evidence_dir = Path(os.environ["MODAL_EVIDENCE_DIR"])
          record_path = evidence_dir / "invocation_record.json"
          raw = record_path.read_text(encoding="utf-8")
          record = json.loads(raw)

          failures = []

          # -- no GPU ---------------------------------------------------------
          declared = (record.get("modal") or {}).get("declared_resources") or {}
          if declared.get("gpu") is not None:
              failures.append(f"the app declared a GPU: {declared.get('gpu')!r}")

          gpu = record.get("gpu_statement") or {}
          if gpu.get("gpu_allocated") is not False:
              failures.append("the record does not state that no GPU was allocated")

          observed = (record.get("worker_observed") or {}).get("gpu_evidence") or {}
          if observed.get("gpu_device_exposed") is not False:
              failures.append("the worker observed a GPU device node")

          # -- no deployment, no production change -----------------------------
          invocation = record.get("invocation") or {}
          if invocation.get("deployment_kind") != "ephemeral":
              failures.append(
                  "the run was not ephemeral: "
                  f"{invocation.get('deployment_kind')!r}"
              )
          if "modal deploy" not in (invocation.get("production_change") or ""):
              failures.append("the record does not state that no deploy was executed")

          # -- the invocation itself succeeded ---------------------------------
          if invocation.get("status") != "SUCCEEDED":
              failures.append(
                  f"the invocation did not succeed: {invocation.get('error')!r}"
              )

          # -- no credential in the evidence -----------------------------------
          for pattern in (
              r"ak-[A-Za-z0-9]{10,}",
              r"as-[A-Za-z0-9]{10,}",
              r"AIza[0-9A-Za-z\-_]{20,}",
              r"ghp_[A-Za-z0-9]{20,}",
              r"sk-[A-Za-z0-9]{16,}",
          ):
              if re.search(pattern, raw):
                  failures.append(
                      f"the evidence carries a credential-shaped string: {pattern}"
                  )

          if failures:
              for failure in failures:
                  print(f"FAILED: {failure}")
              raise SystemExit(1)

          print("the run stayed inside its bounds:")
          print("  no GPU was requested and none was allocated")
          print("  the app was ephemeral: no deployment was created or changed")
          print("  no production worker was redeployed, restarted or stopped")
          print("  no credential-shaped string is present in the evidence")
          PY

      - name: Upload the evidence of the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-modal-cpu-smoke-evidence
          path: ${{ env.MODAL_EVIDENCE_DIR }}
          if-no-files-found: warn

      - name: Upload the logs of the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-modal-cpu-smoke-logs
          path: |
            modal-smoke.log
            modal-validation.log
          if-no-files-found: warn
